[tushare]
# 也可以省略 token，改用 TUSHARE_TOKEN 环境变量。
token = ""

[cache]
path = "data/cache.duckdb"
# 最近 7 个自然日的数据（含空结果）只缓存 5 分钟；更早的数据长期保存。
recent_days = 7
recent_ttl_seconds = 300
snapshot_ttl_seconds = 86400
# 单股票每次最多请求 366 个自然日，避免触及接口单次条数上限。
chunk_days = 366
max_symbols = 20
request_interval_seconds = 1.3
retries = 2
lock_timeout_seconds = 120

# 按接口覆盖默认有效期。到期只在下次请求时更新。
[cache.policies.daily]
# 历史默认长期保留；如需一天后重新检查，可设置 historical_ttl_seconds = 86400。
recent_ttl_seconds = 300
empty_ttl_seconds = 300

[cache.policies.stock_basic]
snapshot_ttl_seconds = 86400
empty_ttl_seconds = 300

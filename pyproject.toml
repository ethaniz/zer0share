[project]
name = "zer0share"
version = "0.1.0"
description = "请求驱动的 Tushare 本地缓存：按股票和日期补齐缺失数据，DuckDB 持久化，无后台调度"
requires-python = ">=3.11"
dependencies = [
    "tushare>=1.4.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "click>=8.1.0",
    "loguru>=0.7.0",
    "httpx>=0.27.0",
    "rqdatac>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zer0share"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]
